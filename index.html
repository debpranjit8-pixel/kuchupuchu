<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎀 A Tiny Surprise 🎀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Trebuchet MS',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
position:relative;

background:linear-gradient(
-45deg,
#ffb6d9,
#ffd6e7,
#ffe8f3,
#fbc2eb,
#ffd1dc,
#fff2f8
);

background-size:500% 500%;
animation:bg 15s ease infinite,fadeIn .9s ease forwards;

opacity:0;

}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

.card{

width:min(92vw,410px);

padding:30px 24px;

background:rgba(255,255,255,.93);

backdrop-filter:blur(14px);

border-radius:30px;

text-align:center;

box-shadow:0 25px 55px rgba(0,0,0,.18);

border:2px solid rgba(255,255,255,.85);

animation:pop .9s ease;

z-index:5;

position:relative;

}

@keyframes pop{

0%{
opacity:0;
transform:translateY(40px) scale(.88);
}

70%{
transform:translateY(-5px) scale(1.02);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
}

}

h1{

color:#ff4f87;
font-size:30px;
margin-bottom:8px;

}

.subtitle{

font-size:17px;
color:#777;
margin-bottom:10px;

}

.ribbon{

font-size:28px;
margin-bottom:18px;
animation:float 2.5s ease-in-out infinite;

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

.note{

background:#fff9fc;

padding:22px;

border-radius:22px;

box-shadow:inset 0 0 18px rgba(255,180,210,.3);

}

.note p{

font-size:16px;

line-height:1.9;

color:#555;

}

.highlight{

color:#ff4f87;
font-weight:bold;

}

button{

margin-top:25px;

padding:16px 40px;

border:none;

border-radius:40px;

background:#111;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.35s;

box-shadow:0 12px 25px rgba(0,0,0,.28);

animation:pulse 2s infinite;

}

button:hover{

transform:scale(1.06);

background:#000;

}

@keyframes pulse{

50%{
transform:scale(1.05);
}

}

.flower{

position:absolute;

top:-60px;

pointer-events:none;

animation:fall linear infinite;

opacity:.95;

user-select:none;

}

@keyframes fall{

0%{

transform:translateY(-10vh) rotate(0deg);

}

100%{

transform:translateY(120vh) rotate(360deg);

}

}

.sparkle{

position:absolute;

width:8px;
height:8px;

border-radius:50%;

background:white;

opacity:.8;

animation:twinkle 2.2s infinite;

}

@keyframes twinkle{

0%,100%{
opacity:.2;
transform:scale(.5);
}

50%{
opacity:1;
transform:scale(1.3);
}

}

@media(max-width:480
<script>

function nextPage(){

document.body.style.transition="opacity .6s ease";
document.body.style.opacity="0";

setTimeout(function(){
window.location.href="page2.html";
},600);

}

const items=[
"🎀","🌸","🌷","🌺","🌼","💖","✨","🩷","💮","🦋","💛"
];

const flowers=document.getElementById("flowers");

for(let i=0;i<40;i++){

let f=document.createElement("div");

f.className="flower";

f.innerHTML=items[Math.floor(Math.random()*items.length)];

f.style.left=Math.random()*100+"vw";

f.style.fontSize=(18+Math.random()*18)+"px";

f.style.animationDuration=(6+Math.random()*5)+"s";

f.style.animationDelay=Math.random()*6+"s";

flowers.appendChild(f);

}

document.addEventListener("click",function(e){

for(let i=0;i<10;i++){

let s=document.createElement("div");

s.innerHTML="✨";

s.style.position="fixed";
s.style.left=e.clientX+"px";
s.style.top=e.clientY+"px";
s.style.fontSize=(14+Math.random()*10)+"px";
s.style.pointerEvents="none";
s.style.transition="all .9s ease";
s.style.zIndex="9999";

document.body.appendChild(s);

setTimeout(()=>{

s.style.transform=`translate(${(Math.random()-0.5)*120}px,${(Math.random()-0.5)*120}px) scale(0)`;
s.style.opacity="0";

},10);

setTimeout(()=>{
s.remove();
},900);

}

});

</script>

</body>

</html>
