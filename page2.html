<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎀 Little Memories 🎀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

background:linear-gradient(
135deg,
#ffd6e7,
#fff1c7,
#dff6ff,
#f5d9ff
);

background-size:400% 400%;
animation:bg 10s infinite alternate;

overflow-x:hidden;

}


@keyframes bg{

0%{
background-position:0% 50%;
}

100%{
background-position:100% 50%;
}

}



.card{

width:min(95vw,480px);

background:rgba(255,255,255,.9);

backdrop-filter:blur(12px);

border-radius:30px;

padding:25px;

box-shadow:0 20px 45px rgba(0,0,0,.15);

animation:pop .8s ease;

}



@keyframes pop{

from{

opacity:0;
transform:scale(.8) translateY(50px);

}

to{

opacity:1;
transform:scale(1) translateY(0);

}

}



h1{

text-align:center;

color:#ff4f87;

margin-bottom:15px;

}



.subtitle{

text-align:center;

color:#777;

line-height:1.6;

}



.box{

padding:18px;

border-radius:20px;

margin:18px 0;

box-shadow:0 8px 20px rgba(0,0,0,.1);

animation:slide .8s ease;

}



@keyframes slide{

from{

opacity:0;
transform:translateX(-40px);

}

to{

opacity:1;
transform:translateX(0);

}

}



.memory{

background:linear-gradient(135deg,#ffe4ef,#fff);

}


.nickname{

background:linear-gradient(135deg,#fff0b3,#fff);

}


.random{

background:linear-gradient(135deg,#dff8ff,#fff);

}



h3{

color:#ff4f87;

margin-bottom:8px;

}



p{

color:#555;

line-height:1.7;

}



ul{

padding-left:20px;

color:#555;

line-height:2;

}



button{

margin-top:20px;

padding:15px 35px;

border:none;

border-radius:40px;

background:#111;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.08);

}


</style>

</head>


<body>


<div class="card">


<h1>🎀 Little Memories 🎀</h1>


<p class="subtitle">

Some random moments that become special memories... 🌸

</p>



<div class="box memory">

<h3>💬 Random Chats 🎀</h3>

<p>

Those random 2-hour conversations where time just disappears... 😂

<br><br>

From silly topics to deep talks, every small conversation becomes a memory. ✨

</p>

</div>




<div class="box random">

<h3>🌸 Little Moments 🎀</h3>

<ul>

<li>Random laughs over
